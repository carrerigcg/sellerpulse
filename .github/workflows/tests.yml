name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Pytest
        run: python -m pytest -v

  backend:
    # Job separado do `test`: o backend precisa de um Postgres de servico
    # (service containers so rodam em runner Linux) e de um conjunto de
    # dependencias diferente do pacote legado em src/.
    #
    # Sem este job, os testes de backend/ nao rodariam em CI nenhum: o
    # pyproject.toml da raiz fixa `testpaths = ["tests"]`, entao `pytest` da
    # raiz coleta so a suite legada. O `backend/pytest.ini` e que configura
    # esta suite, e ele so e encontrado quando o caminho passado e backend/tests.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sellerpulse_test
      SUPABASE_JWT_SECRET: test-secret-do-ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Ruff lint
        run: python -m ruff check backend

      - name: Ruff format check
        run: python -m ruff format --check backend

      - name: Prepare test database
        run: python backend/scripts/setup_test_db.py

      - name: Pytest
        run: python -m pytest backend/tests -v

  frontend:
    # Sem este job, duas sprints de front-end ficavam sem verificacao nenhuma:
    # os jobs acima olham so `src/`, `tests/` e `backend/`. A Vercel quebra o
    # deploy se o build falhar, entao nao era silencioso — mas descobrir no
    # deploy e tarde, e nao cobre lint nem checagem de tipos num PR.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    # O build le estas variaveis em escopo de modulo. Sao valores de fachada:
    # nada aqui conecta em lugar nenhum, so satisfaz a leitura em tempo de
    # build. As de verdade vivem na Vercel.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo-de-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-fachada-do-ci
      NEXT_PUBLIC_API_URL: http://localhost:10000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build (inclui checagem de tipos)
        run: npm run build

[project]
name = "sellerpulse"
version = "0.4.0"
description = "Full-stack analytics pipeline for Mercado Livre sellers."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py", "src/setup_auth.py", "src/dashboard.py", "src/pages/*.py"]

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line-length is enforced by formatter

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` em default de argumento e o idioma oficial de injecao de
# dependencia do FastAPI — B008 e falso positivo nesse caso. Idem para os
# outros marcadores de parametro (Query/Path/Body/Header), caso apareçam.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]
